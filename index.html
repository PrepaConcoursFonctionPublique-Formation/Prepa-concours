<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0a1f44"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap" rel="stylesheet"><title>Concours Fonction Publique 🇧🇫 | QCM &amp; Prépa</title><meta name="description" content="Entraîne-toi aux concours de la fonction publique du Burkina Faso : QCM chronométrés, corrections et classement."><meta property="og:title" content="Concours Fonction Publique 🇧🇫 | QCM &amp; Prépa"><link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--nv:#0a1f44;--nv2:#173a7a;--bl:#2563ff;--gold:#f2c14e;--bg:#eef2f9;--cd:#fff;--tx:#0f1b33;--mu:#5b6b86;--bd:#dbe3f0;--ac:#2563ff;--as:#e6edff;--ok:#12805c;--er:#b3261e;--es:#fbe9e7;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:24px}
h1,h2,.big{font-family:Sora,system-ui,sans-serif;letter-spacing:-.01em}h1{font-size:25px;margin:6px 0;line-height:1.2}h2{font-size:18px;margin:0 0 10px}p{margin:6px 0}.mu{color:var(--mu);font-size:14px}
.top{position:relative;overflow:hidden;background:radial-gradient(110% 80% at 90% 0%,#2a56b3 0,transparent 62%),linear-gradient(160deg,var(--nv),var(--nv2));color:#fff;padding:calc(26px + env(safe-area-inset-top,0px)) 20px 66px;border-radius:0 0 30px 30px}
.top::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1.5px,transparent 1.5px);background-size:18px 18px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--gold),#fff6d6 50%,var(--gold))}
.top>*{position:relative}.top h1{color:#fff}.top p{color:#c7d6f5;margin:4px 0 0}.top.c{text-align:center}
.hero{display:block;width:100%;max-width:320px;height:auto;margin:0 auto 14px;animation:pop .7s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.lg{display:block;width:54px;height:54px;margin-bottom:14px;box-shadow:0 6px 16px rgba(0,0,0,.3);border-radius:15px}
.wrap{margin-top:-38px;padding:0 16px}.pad{padding:12px 16px}
#app>h1,#app>.cd,#app>p{margin-left:16px;margin-right:16px}#app>h1{margin-top:20px}#app>button{width:calc(100% - 32px);margin-left:16px;margin-right:16px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 8px 22px rgba(10,31,68,.08)}
input{width:100%;padding:13px;margin:4px 0 12px;border:1.5px solid var(--bd);border-radius:12px;background:#f8faff;color:var(--tx);font:inherit;-webkit-user-select:text;user-select:text}
input:focus{outline:none;border-color:var(--bl);box-shadow:0 0 0 3px rgba(37,99,255,.18)}
label{font-size:14px;font-weight:600;color:var(--nv)}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 16px;background:linear-gradient(180deg,#3a74ff,#1f56e6);color:#fff;width:100%;margin:6px 0;cursor:pointer;box-shadow:0 8px 16px rgba(37,99,255,.3);transition:transform .12s}
button:active{transform:scale(.98)}button.s{background:#e4ebfb;color:var(--nv);box-shadow:none}button:disabled{opacity:.4;box-shadow:none}button:focus-visible,.op:focus-visible,a.wa:focus-visible{outline:3px solid var(--nv);outline-offset:2px}
.op{display:flex;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--bd);border-radius:14px;margin:9px 0;cursor:pointer;background:#fff;transition:border-color .12s,background .12s}
.op b{display:grid;place-items:center;min-width:30px;height:30px;border-radius:9px;background:var(--bg);color:var(--nv)}
.op.on{border-color:var(--bl);background:var(--as)}.op.on b{background:var(--bl);color:#fff}
.prog{height:7px;background:var(--bd);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--gold));border-radius:9px;transition:width .3s}
.bar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
.tm{background:var(--nv);color:var(--gold);padding:6px 14px;border-radius:99px;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}.tm.lo{background:#f59e0b;color:var(--nv)}
.ok{border-left:5px solid var(--ok)}.ko{border-left:5px solid var(--er)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:#dcf3ea;color:var(--ok);margin-right:6px}.tag.r{background:var(--es);color:var(--er)}
.ring{display:flex;align-items:center;gap:18px}.ring svg{width:116px;flex:none}.ring .big{font-size:40px;font-weight:800;line-height:1;color:var(--gold)}
.err{color:var(--er);font-size:14px}.info{color:var(--ok);font-size:14px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}.row.me{font-weight:700;color:var(--bl);background:linear-gradient(90deg,#e4ecff,transparent);border-radius:8px;padding-left:6px}
a.wa{display:block;text-align:center;text-decoration:none;font-weight:700;background:#25d366;color:#06361b;border-radius:14px;padding:14px 16px;margin:10px 0;line-height:1.35}
svg{width:100%;height:auto}body.hid #app{filter:blur(18px)}@media print{body{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><div id="app"><p class="mu">Chargement…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
const URL_SB="https://uaqmpgnrodeerbyphsni.supabase.co",KEY="sb_publishable_bxZT0CbLE3HQkhvlRfLEzg_1fE94cJr";
const sb=supabase.createClient(URL_SB,KEY);
const HERO=`<svg class="hero" viewBox="0 0 320 188" role="img" aria-label="Bâtiment de l administration publique, liste de QCM et chronomètre"><defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cdd9f3"/></linearGradient></defs><circle cx="160" cy="100" r="92" fill="#fff" opacity=".07"/><circle cx="160" cy="100" r="64" fill="#fff" opacity=".07"/><polygon points="58,80 160,32 262,80" fill="url(#gA)"/><circle cx="160" cy="64" r="7" fill="#f2c14e"/><rect x="58" y="80" width="204" height="10" fill="#fff"/><g fill="url(#gA)"><rect x="81" y="94" width="14" height="56"/><rect x="117" y="94" width="14" height="56"/><rect x="153" y="94" width="14" height="56"/><rect x="189" y="94" width="14" height="56"/><rect x="225" y="94" width="14" height="56"/></g><rect x="54" y="150" width="212" height="8" rx="2" fill="#fff"/><rect x="46" y="158" width="228" height="8" rx="2" fill="#e3ebfa"/><rect x="38" y="166" width="244" height="8" rx="2" fill="#c3d3f2"/><polygon points="160,7 162.6,13.2 169.5,13.5 164.1,17.8 166,24.5 160,20.7 154,24.5 155.9,17.8 150.5,13.5 157.4,13.2" fill="#f2c14e"/><rect x="4" y="62" width="52" height="68" rx="10" fill="#fff"/><g><circle cx="17" cy="79" r="5" fill="#2563ff"/><rect x="27" y="76.5" width="22" height="5" rx="2.5" fill="#cdd9f2"/><circle cx="17" cy="95" r="5" fill="#2563ff"/><rect x="27" y="92.5" width="18" height="5" rx="2.5" fill="#cdd9f2"/><circle cx="17" cy="111" r="4.2" fill="none" stroke="#9db3e0" stroke-width="2"/><rect x="27" y="108.5" width="20" height="5" rx="2.5" fill="#cdd9f2"/></g><circle cx="291" cy="98" r="23" fill="#fff"/><circle cx="291" cy="98" r="17" fill="none" stroke="#f2c14e" stroke-width="4"/><path d="M291 98V86M291 98l8 4" stroke="#0a1f44" stroke-width="3" stroke-linecap="round" fill="none"/><rect x="287" y="70" width="8" height="4" rx="2" fill="#fff"/></svg>`,LOGO=`<svg class="lg" viewBox="0 0 64 64" role="img" aria-label="Concours Fonction Publique"><rect width="64" height="64" rx="16" fill="#fff"/><polygon points="12,29 32,17 52,29" fill="#0a1f44"/><rect x="12" y="29" width="40" height="4" fill="#0a1f44"/><rect x="17" y="35" width="6" height="14" fill="#0a1f44"/><rect x="29" y="35" width="6" height="14" fill="#0a1f44"/><rect x="41" y="35" width="6" height="14" fill="#0a1f44"/><rect x="10" y="50" width="44" height="5" rx="1.5" fill="#0a1f44"/><circle cx="32" cy="26" r="2.6" fill="#f2c14e"/></svg>`;
const WA='<a class="wa" href="https://whatsapp.com/channel/0029VbC7P8x1NCrLoieUGe2g" target="_blank" rel="noopener noreferrer">Suivre la chaîne Concours Fonction Publique 🇧🇫 | QCM &amp; Prépa sur WhatsApp</a>';
const $=document.getElementById("app"),L="ABCDEF";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const g=id=>document.getElementById(id),v=id=>g(id).value.trim();
const mmss=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
let me=null,S={};
// dissuasion captures / copie (limites du web)
document.addEventListener("contextmenu",e=>e.preventDefault());
["copy","cut","dragstart"].forEach(k=>document.addEventListener(k,e=>e.preventDefault()));
const hide=x=>document.body.classList.toggle("hid",x&&S.view==="quiz");
document.addEventListener("visibilitychange",()=>hide(document.hidden));
window.addEventListener("blur",()=>hide(true));window.addEventListener("focus",()=>hide(false));

(async()=>{const{data}=await sb.auth.getSession();data.session?home():login()})();

function login(msg,ok){
 $.innerHTML=`<div class="top c">${HERO}<h1>Concours Fonction Publique 🇧🇫</h1><p>QCM &amp; Prépa · Entraîne-toi dans les conditions du concours.</p></div><div class="wrap"><div class="cd">
 <label>ID candidat (ou e-mail)</label><input id="i" placeholder="CFP-00001" autocapitalize="characters" autocomplete="username">
 <label>Mot de passe</label><input id="p" type="password" autocomplete="current-password">
 <p class="${ok?"info":"err"}">${msg||""}</p><button id="go">Se connecter</button><button class="s" id="rg">Créer un compte</button></div>${WA}</div>`;
 g("rg").onclick=()=>reg();
 g("go").onclick=async()=>{
  g("go").disabled=true;
  try{const r=await fetch(URL_SB+"/functions/v1/smart-action",{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify({id:v("i"),password:g("p").value})});
   const d=await r.json();if(!r.ok)return login(esc(d.error||"Connexion impossible"));
   await sb.auth.setSession({access_token:d.session.access_token,refresh_token:d.session.refresh_token});home()}
  catch(e){login("Erreur réseau, réessaie.")}};
}
function reg(msg){
 $.innerHTML=`<div class="top">${LOGO}<h1>Créer mon compte</h1><p>Tu reçois ton ID candidat dès l'inscription.</p></div><div class="wrap"><div class="cd">
 <label>Nom</label><input id="n" autocomplete="family-name"><label>Prénom</label><input id="pr" autocomplete="given-name">
 <label>E-mail</label><input id="m" type="email" autocomplete="email"><label>WhatsApp</label><input id="w" inputmode="tel" placeholder="+226 70 00 00 00">
 <label>Mot de passe (8 caractères minimum)</label><input id="p" type="password" autocomplete="new-password">
 <p class="err">${msg||""}</p><button id="go">Créer mon compte</button><button class="s" id="bk">Retour</button></div></div>`;
 g("bk").onclick=()=>login();
 g("go").onclick=async()=>{
  const d={nom:v("n"),prenom:v("pr"),whatsapp:v("w")},m=v("m"),p=g("p").value;
  if(!d.nom||!d.prenom)return reg("Nom et prénom obligatoires.");
  if(!/^\S+@\S+\.\S+$/.test(m))return reg("E-mail invalide.");
  if(!/^\+226 ?\d{2} ?\d{2} ?\d{2} ?\d{2}$/.test(d.whatsapp))return reg("WhatsApp : format +226 XX XX XX XX.");
  if(p.length<8)return reg("Mot de passe : 8 caractères minimum.");
  g("go").disabled=true;
  const{error}=await sb.auth.signUp({email:m,password:p,options:{data:d}});
  if(error)return reg(esc(error.message));
  login("Compte créé. Confirme ton e-mail (vérifie aussi les spams), puis connecte-toi avec ton e-mail. Ton ID candidat s'affichera dans ton espace.",1)};
}
async function home(){
 S.view="menu";
 const{data:u}=await sb.auth.getUser();if(!u.user)return login();
 const[{data:pf},{data:qs}]=await Promise.all([sb.from("profiles").select("candidate_id,prenom").eq("id",u.user.id).single(),sb.from("qcm").select("*").eq("actif",true).order("id")]);
 me={uid:u.user.id,cid:pf?pf.candidate_id:"",prenom:pf?pf.prenom:""};
 $.innerHTML=`<div class="top">${LOGO}<h1>Bonjour ${esc(me.prenom)}</h1><p>Ton ID candidat : <b>${esc(me.cid)}</b>. Garde-le pour te connecter.</p></div><div class="wrap">`+
 (qs||[]).map(q=>`<div class="cd"><h2>${esc(q.titre)}</h2><p class="mu">${q.secondes_par_question} s par question</p><button data-k="${q.id}">Commencer</button></div>`).join("")+
 `${WA}<button class="s" id="pg">Ma progression</button><button class="s" id="lo">Déconnexion</button></div>`;
 $.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>start(+b.dataset.k));
 g("pg").onclick=async()=>{const h=await hist();$.innerHTML=`<h1>Ma progression</h1><div class="cd">${curve(h)}</div><button class="s" id="b">Retour</button>`;g("b").onclick=home};
 g("lo").onclick=async()=>{await sb.auth.signOut();login()};
}
async function hist(){const{data}=await sb.from("attempts").select("pct,qcm_id,started_at").eq("user_id",me.uid).eq("status","valide").order("started_at");return(data||[]).slice(-30)}
async function start(k){
 $.innerHTML='<p class="mu">Préparation…</p>';
 const{data,error}=await sb.rpc("start_attempt",{p_qcm:k});
 if(error||!data.questions.length){$.innerHTML='<div class="cd"><p>Ce QCM n\'a pas encore de questions.</p></div><button id="b">Retour</button>';return g("b").onclick=home}
 S={view:"quiz",k,att:data.attempt_id,qs:data.questions,n:data.questions.length,c:0,a:{}};
 data.questions.forEach(q=>S.a[q.id]=[]);S.left=S.n*data.secondes_par_question;
 draw();S.tm=setInterval(()=>{S.left--;const t=g("tm");if(t){t.textContent=mmss(S.left);t.classList.toggle("lo",S.left<=30)}if(S.left<=0){clearInterval(S.tm);end()}},1000);
}
const done=()=>Object.values(S.a).filter(x=>x.length).length;
function draw(){
 const q=S.qs[S.c],a=S.a[q.id],ok=done()/S.n>=.75;
 $.innerHTML=`<div class="pad"><div class="prog"><i style="width:${(S.c+1)/S.n*100}%"></i></div><div class="bar"><span class="mu">Question ${S.c+1}/${S.n} · ${done()} répondue(s)</span><span class="tm" id="tm">${mmss(S.left)}</span></div>
 <div class="cd"><h2>${esc(q.enonce)}</h2><p class="mu">${q.multi?"Plusieurs réponses possibles. ":""}Tout ou rien.</p>
 ${q.options.map((o,i)=>`<div class="op ${a.includes(i)?"on":""}" data-i="${i}"><b>${L[i]}</b><span>${esc(o)}</span></div>`).join("")}</div>
 <div style="display:flex;gap:8px"><button class="s" id="pv" ${S.c?"":"disabled"}>Précédent</button><button class="s" id="nx" ${S.c<S.n-1?"":"disabled"}>Suivant</button></div>
 <button id="fin" ${ok?"":"disabled"}>Terminer et voir les résultats</button><p class="mu">${ok?"":"Résultats disponibles dès 75 % de questions répondues."}</p></div>`;
 $.querySelectorAll(".op").forEach(e=>e.onclick=()=>{const i=+e.dataset.i,x=a.indexOf(i);x<0?a.push(i):a.splice(x,1);draw()});
 g("pv").onclick=()=>{S.c--;draw()};g("nx").onclick=()=>{S.c++;draw()};g("fin").onclick=end;
}
async function end(){
 clearInterval(S.tm);S.view="res";$.innerHTML='<p class="mu">Correction en cours…</p>';
 const{data:r,error}=await sb.rpc("submit_attempt",{p_attempt:S.att,p_answers:S.a});
 if(error||!r.valide){$.innerHTML=`<h1>Série non validée</h1><div class="cd"><p>Temps écoulé ou moins de 75 % de questions répondues. Aucun résultat n'est affiché.</p></div><button id="b">Retour</button>`;return g("b").onclick=home}
 const[{data:lb},h]=await Promise.all([sb.rpc("leaderboard",{p_qcm:S.k}),hist()]);
 $.innerHTML=`<div class="top"><p>Résultats</p><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="#f2c14e" stroke-width="10" stroke-linecap="round" stroke-dasharray="${r.pct*3.267} 327" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">${r.pct}%</text></svg><div><div class="big">${r.score}/${r.total}</div><p>Classement : <b>${r.rang.rang}ᵉ sur ${r.rang.total}</b></p></div></div></div><div class="wrap">
 <div class="cd"><h2>Classement (ID uniquement)</h2>${(lb||[]).slice(0,10).map(x=>`<div class="row ${x.cid===me.cid?"me":""}"><span>${["🥇","🥈","🥉"][x.rang-1]||x.rang+"."} ${esc(x.cid)}${x.cid===me.cid?" (toi)":""}</span><b>${x.score_pct} %</b></div>`).join("")}</div>
 <div class="cd"><h2>Ma progression</h2>${curve(h)}</div><h2>Corrections</h2>
 ${r.corrections.map((c,i)=>`<div class="cd ${c.juste?"ok":"ko"}"><p><b>${i+1}. ${esc(c.enonce)}</b></p>
 <p><span class="tag">Bonne réponse</span>${c.bonnes.map(j=>L[j]+". "+esc(c.options[j])).join(" ; ")}</p>
 <p><span class="tag ${c.juste?"":"r"}">Ta réponse</span>${c.donnees.length?c.donnees.map(j=>L[j]).join(", "):"aucune"} ${c.juste?"✓":"✗"}</p><p class="mu">${esc(c.explication||"")}</p></div>`).join("")}
 <button id="b">Retour au menu</button>${WA}</div>`;
 g("b").onclick=home;
}
function curve(h){
 if(h.length<2)return'<p class="mu">Fais au moins 2 séries pour voir ta courbe.</p>';
 const W=320,H=140,p=24,x=i=>p+i*(W-2*p)/(h.length-1),y=t=>H-p-t*(H-2*p)/100;
 return`<svg viewBox="0 0 ${W} ${H}"><line x1="${p}" y1="${y(0)}" x2="${W-p}" y2="${y(0)}" stroke="var(--bd)"/><line x1="${p}" y1="${y(75)}" x2="${W-p}" y2="${y(75)}" stroke="var(--bd)" stroke-dasharray="3"/>
 <polyline fill="none" stroke="var(--ac)" stroke-width="3" points="${h.map((a,i)=>x(i)+","+y(a.pct)).join(" ")}"/>${h.map((a,i)=>`<circle cx="${x(i)}" cy="${y(a.pct)}" r="4" fill="var(--ac)"/>`).join("")}<text x="${p}" y="${y(75)-3}" font-size="9" fill="var(--mu)">75 %</text></svg>`;
}
</script></body></html>
