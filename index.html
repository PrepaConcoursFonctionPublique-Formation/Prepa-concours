<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Prépa Concours FP</title>
<style>
:root{--bg:#f4f6f8;--cd:#fff;--tx:#1b2430;--mu:#5d6b7c;--ac:#0b6b3a;--as:#e3f1e8;--bd:#d5dbe3;--er:#b3261e;--es:#fbe6e4;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--cd:#1a222c;--tx:#e8edf3;--mu:#9aa8b8;--ac:#4fc283;--as:#173226;--bd:#2c3745;--er:#ff8a80;--es:#3a1d1b;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}h2{font-size:18px;margin:0 0 10px}p{margin:6px 0}.mu{color:var(--mu);font-size:14px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
input{width:100%;padding:12px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;-webkit-user-select:text;user-select:text}
label{font-size:14px;color:var(--mu)}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 16px;background:var(--ac);color:#fff;width:100%;margin:6px 0;cursor:pointer}
button.s{background:var(--as);color:var(--ac)}button:disabled{opacity:.4}
.op{display:flex;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:12px;margin:8px 0;cursor:pointer}
.op.on{border-color:var(--ac);background:var(--as)}.op b{min-width:22px}
.bar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.tm{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}.tm.lo{color:var(--er)}
.ok{border-left:4px solid var(--ac)}.ko{border-left:4px solid var(--er)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--as);color:var(--ac);margin-right:4px}.tag.r{background:var(--es);color:var(--er)}
.big{font-size:44px;font-weight:800;color:var(--ac);line-height:1.1}.err{color:var(--er);font-size:14px}.info{color:var(--ac);font-size:14px}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}.row.me{font-weight:700;color:var(--ac)}
svg{width:100%;height:auto}body.hid #app{filter:blur(18px)}@media print{body{display:none}}
</style></head><body><div id="app"><p class="mu">Chargement…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
const URL_SB="https://uaqmpgnrodeerbyphsni.supabase.co",KEY="sb_publishable_bxZT0CbLE3HQkhvlRfLEzg_1fE94cJr";
const sb=supabase.createClient(URL_SB,KEY);
const $=document.getElementById("app"),L="ABCDEF";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const g=id=>document.getElementById(id),v=id=>g(id).value.trim();
const mmss=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
let me=null,S={};
// dissuasion captures / copie (limites du web)
document.addEventListener("contextmenu",e=>e.preventDefault());
["copy","cut","dragstart"].forEach(k=>document.addEventListener(k,e=>e.preventDefault()));
const hide=x=>document.body.classList.toggle("hid",x&&S.view==="quiz");
document.addEventListener("visibilitychange",()=>hide(document.hidden));
window.addEventListener("blur",()=>hide(true));window.addEventListener("focus",()=>hide(false));

(async()=>{const{data}=await sb.auth.getSession();data.session?home():login()})();

function login(msg,ok){
 $.innerHTML=`<h1>Prépa Concours FP</h1><p class="mu">Connexion candidat</p><div class="cd">
 <label>ID candidat (ou e-mail)</label><input id="i" placeholder="CFP-00001" autocapitalize="characters" autocomplete="username">
 <label>Mot de passe</label><input id="p" type="password" autocomplete="current-password">
 <p class="${ok?"info":"err"}">${msg||""}</p><button id="go">Se connecter</button><button class="s" id="rg">Créer un compte</button></div>`;
 g("rg").onclick=()=>reg();
 g("go").onclick=async()=>{
  g("go").disabled=true;
  try{const r=await fetch(URL_SB+"/functions/v1/smart-action",{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify({id:v("i"),password:g("p").value})});
   const d=await r.json();if(!r.ok)return login(esc(d.error||"Connexion impossible"));
   await sb.auth.setSession({access_token:d.session.access_token,refresh_token:d.session.refresh_token});home()}
  catch(e){login("Erreur réseau, réessaie.")}};
}
function reg(msg){
 $.innerHTML=`<h1>Inscription candidat</h1><div class="cd">
 <label>Nom</label><input id="n" autocomplete="family-name"><label>Prénom</label><input id="pr" autocomplete="given-name">
 <label>E-mail</label><input id="m" type="email" autocomplete="email"><label>WhatsApp</label><input id="w" inputmode="tel" placeholder="+226 70 00 00 00">
 <label>Mot de passe (8 caractères minimum)</label><input id="p" type="password" autocomplete="new-password">
 <p class="err">${msg||""}</p><button id="go">Créer mon compte</button><button class="s" id="bk">Retour</button></div>`;
 g("bk").onclick=()=>login();
 g("go").onclick=async()=>{
  const d={nom:v("n"),prenom:v("pr"),whatsapp:v("w")},m=v("m"),p=g("p").value;
  if(!d.nom||!d.prenom)return reg("Nom et prénom obligatoires.");
  if(!/^\S+@\S+\.\S+$/.test(m))return reg("E-mail invalide.");
  if(!/^\+226 ?\d{2} ?\d{2} ?\d{2} ?\d{2}$/.test(d.whatsapp))return reg("WhatsApp : format +226 XX XX XX XX.");
  if(p.length<8)return reg("Mot de passe : 8 caractères minimum.");
  g("go").disabled=true;
  const{error}=await sb.auth.signUp({email:m,password:p,options:{data:d}});
  if(error)return reg(esc(error.message));
  login("Compte créé. Confirme ton e-mail (vérifie aussi les spams), puis connecte-toi avec ton e-mail. Ton ID candidat s'affichera dans ton espace.",1)};
}
async function home(){
 S.view="menu";
 const{data:u}=await sb.auth.getUser();if(!u.user)return login();
 const[{data:pf},{data:qs}]=await Promise.all([sb.from("profiles").select("candidate_id,prenom").eq("id",u.user.id).single(),sb.from("qcm").select("*").eq("actif",true).order("id")]);
 me={uid:u.user.id,cid:pf?pf.candidate_id:"",prenom:pf?pf.prenom:""};
 $.innerHTML=`<h1>Bonjour ${esc(me.prenom)}</h1><p class="mu">Ton ID candidat : <b>${esc(me.cid)}</b> (garde-le pour te connecter)</p>`+
 (qs||[]).map(q=>`<div class="cd"><h2>${esc(q.titre)}</h2><p class="mu">${q.secondes_par_question} s par question</p><button data-k="${q.id}">Commencer</button></div>`).join("")+
 `<button class="s" id="pg">Ma progression</button><button class="s" id="lo">Déconnexion</button>`;
 $.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>start(+b.dataset.k));
 g("pg").onclick=async()=>{const h=await hist();$.innerHTML=`<h1>Ma progression</h1><div class="cd">${curve(h)}</div><button class="s" id="b">Retour</button>`;g("b").onclick=home};
 g("lo").onclick=async()=>{await sb.auth.signOut();login()};
}
async function hist(){const{data}=await sb.from("attempts").select("pct,qcm_id,started_at").eq("user_id",me.uid).eq("status","valide").order("started_at");return(data||[]).slice(-30)}
async function start(k){
 $.innerHTML='<p class="mu">Préparation…</p>';
 const{data,error}=await sb.rpc("start_attempt",{p_qcm:k});
 if(error||!data.questions.length){$.innerHTML='<div class="cd"><p>Ce QCM n\'a pas encore de questions.</p></div><button id="b">Retour</button>';return g("b").onclick=home}
 S={view:"quiz",k,att:data.attempt_id,qs:data.questions,n:data.questions.length,c:0,a:{}};
 data.questions.forEach(q=>S.a[q.id]=[]);S.left=S.n*data.secondes_par_question;
 draw();S.tm=setInterval(()=>{S.left--;const t=g("tm");if(t){t.textContent=mmss(S.left);t.classList.toggle("lo",S.left<=30)}if(S.left<=0){clearInterval(S.tm);end()}},1000);
}
const done=()=>Object.values(S.a).filter(x=>x.length).length;
function draw(){
 const q=S.qs[S.c],a=S.a[q.id],ok=done()/S.n>=.75;
 $.innerHTML=`<div class="bar"><span class="mu">Question ${S.c+1}/${S.n} · ${done()} répondue(s)</span><span class="tm" id="tm">${mmss(S.left)}</span></div>
 <div class="cd"><h2>${esc(q.enonce)}</h2><p class="mu">${q.multi?"Plusieurs réponses possibles. ":""}Tout ou rien.</p>
 ${q.options.map((o,i)=>`<div class="op ${a.includes(i)?"on":""}" data-i="${i}"><b>${L[i]}</b><span>${esc(o)}</span></div>`).join("")}</div>
 <div style="display:flex;gap:8px"><button class="s" id="pv" ${S.c?"":"disabled"}>Précédent</button><button class="s" id="nx" ${S.c<S.n-1?"":"disabled"}>Suivant</button></div>
 <button id="fin" ${ok?"":"disabled"}>Terminer et voir les résultats</button><p class="mu">${ok?"":"Résultats disponibles dès 75 % de questions répondues."}</p>`;
 $.querySelectorAll(".op").forEach(e=>e.onclick=()=>{const i=+e.dataset.i,x=a.indexOf(i);x<0?a.push(i):a.splice(x,1);draw()});
 g("pv").onclick=()=>{S.c--;draw()};g("nx").onclick=()=>{S.c++;draw()};g("fin").onclick=end;
}
async function end(){
 clearInterval(S.tm);S.view="res";$.innerHTML='<p class="mu">Correction en cours…</p>';
 const{data:r,error}=await sb.rpc("submit_attempt",{p_attempt:S.att,p_answers:S.a});
 if(error||!r.valide){$.innerHTML=`<h1>Série non validée</h1><div class="cd"><p>Temps écoulé ou moins de 75 % de questions répondues. Aucun résultat n'est affiché.</p></div><button id="b">Retour</button>`;return g("b").onclick=home}
 const[{data:lb},h]=await Promise.all([sb.rpc("leaderboard",{p_qcm:S.k}),hist()]);
 $.innerHTML=`<h1>Résultats</h1><div class="cd"><div class="big">${r.score}/${r.total}</div><p>${r.pct} % · Classement : <b>${r.rang.rang}ᵉ sur ${r.rang.total}</b></p></div>
 <div class="cd"><h2>Classement (ID uniquement)</h2>${(lb||[]).slice(0,10).map(x=>`<div class="row ${x.cid===me.cid?"me":""}"><span>${x.rang}. ${esc(x.cid)}${x.cid===me.cid?" (toi)":""}</span><b>${x.score_pct} %</b></div>`).join("")}</div>
 <div class="cd"><h2>Ma progression</h2>${curve(h)}</div><h2>Corrections</h2>
 ${r.corrections.map((c,i)=>`<div class="cd ${c.juste?"ok":"ko"}"><p><b>${i+1}. ${esc(c.enonce)}</b></p>
 <p><span class="tag">Bonne réponse</span>${c.bonnes.map(j=>L[j]+". "+esc(c.options[j])).join(" ; ")}</p>
 <p><span class="tag ${c.juste?"":"r"}">Ta réponse</span>${c.donnees.length?c.donnees.map(j=>L[j]).join(", "):"aucune"} ${c.juste?"✓":"✗"}</p><p class="mu">${esc(c.explication||"")}</p></div>`).join("")}
 <button id="b">Retour au menu</button>`;
 g("b").onclick=home;
}
function curve(h){
 if(h.length<2)return'<p class="mu">Fais au moins 2 séries pour voir ta courbe.</p>';
 const W=320,H=140,p=24,x=i=>p+i*(W-2*p)/(h.length-1),y=t=>H-p-t*(H-2*p)/100;
 return`<svg viewBox="0 0 ${W} ${H}"><line x1="${p}" y1="${y(0)}" x2="${W-p}" y2="${y(0)}" stroke="var(--bd)"/><line x1="${p}" y1="${y(75)}" x2="${W-p}" y2="${y(75)}" stroke="var(--bd)" stroke-dasharray="3"/>
 <polyline fill="none" stroke="var(--ac)" stroke-width="3" points="${h.map((a,i)=>x(i)+","+y(a.pct)).join(" ")}"/>${h.map((a,i)=>`<circle cx="${x(i)}" cy="${y(a.pct)}" r="4" fill="var(--ac)"/>`).join("")}<text x="${p}" y="${y(75)-3}" font-size="9" fill="var(--mu)">75 %</text></svg>`;
}
</script></body></html>
